name: pingvin
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: stonith404/pingvin-share:latest
    container_name: pingvin-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: pingvin-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD-SHELL', '/bin/sh -c ''(if [[ "$$CADDY_DISABLED" = "true" ]]; then curl -fs http://localhost:$${BACKEND_PORT:-8080}/api/health; else curl -fs http://localhost:3000/api/health; fi) || exit 1''']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/pingvin:/opt/app/backend/data'
      - './volumes/data/pingvin-images:/opt/app/frontend/public/img'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://pingvin-app:3000'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - pingvin
      - cloudflare

networks:
  pingvin:
    name: pingvin
    external: false
  cloudflare:
    external: true
