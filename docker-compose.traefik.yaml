name: pingvin
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: stonith404/pingvin-share:latest
    container_name: pingvin-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: pingvin-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/data/pingvin:/opt/app/backend/data'
      - './volumes/data/pingvin-images:/opt/app/frontend/public/img'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.pingvin.entrypoints=http'
      - 'traefik.http.routers.pingvin.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.pingvin.middlewares=pingvin-https-redirect'
      - 'traefik.http.middlewares.pingvin-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.pingvin-secure.entrypoints=https'
      - 'traefik.http.routers.pingvin-secure.tls=true'
      - 'traefik.http.routers.pingvin-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.pingvin-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.pingvin-secure.service=pingvin'
      - 'traefik.http.services.pingvin.loadbalancer.server.port=3000'
    networks:
      - pingvin
      - traefik

networks:
  pingvin:
    name: pingvin
    external: false
  traefik:
    external: true
